<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardfootIndex | Lumber & Workshop Cost Index</title>
  <link rel="icon" type="image/png" href="/logo-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      max-width: 980px;
      margin: 0 auto;
      text-align: center;
      padding: 40px 20px 80px;
      color: #333;
    }
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      max-height: 76px;
      width: auto;
      max-width: 100%;
      height: auto;
      display: block;
      margin-bottom: 10px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    p.subtitle {
      font-size: 1.15rem;
      color: #666;
      margin: 0;
    }
    .print-meta {
      display: none;
    }

    /* Estimator Card */
    .estimator-card {
      background-color: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 32px;
      text-align: left;
    }
    .estimator-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .estimator-header h2 {
      font-size: 1.25rem;
      margin: 0;
      color: #111;
    }
    .estimator-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 6px 12px;
      border: 1px solid #ccc;
      background: #fff;
      color: #222;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
      font-weight: 600;
    }
    .estimator-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
    }
    .field-group select,
    .field-group input {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fff;
      color: #222;
    }
    .field-group.grow {
      flex: 1;
      min-width: 220px;
    }
    .field-group.med {
      width: 165px;
    }
    .field-group.small {
      width: 98px;
    }
    .primary-btn {
      padding: 9px 16px;
      background: #111;
      color: #fff;
      border: 1px solid #111;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .primary-btn:hover {
      background: #2b2b2b;
    }
    .secondary-btn {
      padding: 6px 11px;
      background: #fff;
      color: #222;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .secondary-btn:hover {
      background: #f0f0f0;
    }
    .bf-result-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #e2e5e9;
      border-radius: 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      font-size: 0.96rem;
    }
    .bf-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    .estimate-list {
      margin-top: 18px;
      border-top: 1px solid #e2e5e9;
      padding-top: 14px;
    }
    .estimate-list-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .estimate-list-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
    }
    .export-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .estimate-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eceef1;
      font-size: 0.95rem;
    }
    .estimate-item-info {
      flex: 1;
      min-width: 210px;
    }
    .badge-custom {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      background: #eef2ff;
      color: #1e40af;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .estimate-item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .estimate-item-actions input {
      width: 65px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      text-align: center;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #b00020;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
    }
    .estimate-summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 10px;
    }
    .total-box {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111;
    }

    /* Filter & Search Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      text-align: left;
    }
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-btn {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background-color: #fff;
      color: #222;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s ease;
    }
    .filter-btn:hover {
      background-color: #f3f4f6;
    }
    .filter-btn.active {
      background-color: #111;
      color: #fff;
      border-color: #111;
      font-weight: 600;
    }
    .search-box {
      padding: 9px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 240px;
      color: #222;
    }
    .search-box:focus {
      outline: none;
      border-color: #111;
    }

    /* Table */
    #prices-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      text-align: left;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f5f5f5;
      font-weight: 600;
      color: #111;
    }
    th.sortable {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th.sortable:hover {
      background-color: #eaeaea;
    }
    .sort-indicator {
      margin-left: 6px;
      font-size: 0.75rem;
      color: #666;
    }
    th.sorted .sort-indicator {
      color: #111;
    }
    tr:hover {
      background-color: #fafafa;
    }
    a.source-link {
      color: #0b57d0;
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
    }
    a.source-link:hover {
      text-decoration: underline;
    }
    .status {
      color: #666;
      font-style: italic;
      margin-top: 24px;
    }
    .result-count {
      font-size: 0.9rem;
      color: #666;
      text-align: left;
      margin-bottom: 8px;
    }

    /* Clean Print / Save PDF Layout */
    @media print {
      body {
        padding: 0;
        text-align: left;
        color: #000;
      }
      .brand-header {
        align-items: flex-start;
        margin-bottom: 12px;
      }
      .brand-logo {
        max-height: 48px;
        margin-bottom: 6px;
      }
      p.subtitle,
      .estimator-tabs,
      #panel-catalog,
      #panel-bf,
      .export-actions,
      .remove-btn,
      #clear-estimate-btn,
      .controls,
      #result-count,
      #prices-container {
        display: none !important;
      }
      .print-meta {
        display: block;
        font-size: 0.9rem;
        color: #555;
        margin-bottom: 16px;
      }
      .estimator-card {
        background: #fff;
        border: none;
        padding: 0;
        margin: 0;
      }
      .estimate-list {
        border-top: 2px solid #111;
        margin-top: 8px;
      }
      .estimate-item-actions input,
      #waste-select {
        border: none;
        background: transparent;
        font-weight: 600;
        padding: 0;
        appearance: none;
        -webkit-appearance: none;
      }
    }
  </style>
</head>
<body>
  <header class="brand-header">
    <h1 class="sr-only">BoardfootIndex</h1>
    <img src="/logo-horizontal.png" alt="Boardfootindex.com" class="brand-logo" />
    <p class="subtitle">Automated outbuilding, workshop, and lumber price tracking engine coming online.</p>
  </header>
  <p class="print-meta" id="print-meta"></p>

  <!-- Unified Project & Board-Foot Estimator -->
  <section class="estimator-card" aria-label="Project and Board-Foot Estimator">
    <div class="estimator-header">
      <h2>Project &amp; Board-Foot Estimator</h2>
      <div class="estimator-tabs">
        <button type="button" class="tab-btn active" id="tab-catalog">Index Materials (Per Piece / Sheet)</button>
        <button type="button" class="tab-btn" id="tab-bf">Custom / Rough Lumber (BF)</button>
      </div>
    </div>

    <!-- Mode 1: Add Standard Material from Index -->
    <div id="panel-catalog">
      <div class="estimator-row">
        <div class="field-group grow">
          <label for="material-select">Select Material from Index</label>
          <select id="material-select">
            <option value="">Loading materials...</option>
          </select>
        </div>
        <div class="field-group small">
          <label for="material-qty">Quantity</label>
          <input type="number" id="material-qty" min="1" step="1" value="1" />
        </div>
        <button type="button" class="primary-btn" id="add-to-estimate-btn">+ Add to Takeoff</button>
      </div>
    </div>

    <!-- Mode 2: Custom Board-Foot Calculator -> Adds into Same Takeoff -->
    <div id="panel-bf" style="display: none;">
      <div class="estimator-row">
        <div class="field-group med">
          <label for="bf-label">Species / Label</label>
          <input type="text" id="bf-label" placeholder="e.g. Rough White Oak" value="Custom Hardwood" />
        </div>
        <div class="field-group small">
          <label for="bf-thickness">Thickness (in)</label>
          <input type="number" id="bf-thickness" min="0.25" step="0.25" value="1" />
        </div>
        <div class="field-group small">
          <label for="bf-width">Width (in)</label>
          <input type="number" id="bf-width" min="0.5" step="0.5" value="6" />
        </div>
        <div class="field-group small">
          <label for="bf-length">Length (ft)</label>
          <input type="number" id="bf-length" min="1" step="1" value="8" />
        </div>
        <div class="field-group small">
          <label for="bf-qty">Pieces</label>
          <input type="number" id="bf-qty" min="1" step="1" value="1" />
        </div>
        <div class="field-group small">
          <label for="bf-rate">$/BF</label>
          <input type="number" id="bf-rate" min="0" step="0.01" value="5.34" />
        </div>
      </div>

      <div class="bf-result-box">
        <div class="bf-metrics" id="bf-metrics"></div>
        <button type="button" class="primary-btn" id="add-bf-to-estimate-btn">+ Add Custom Lumber to Takeoff</button>
      </div>
    </div>

    <!-- Shared Project Takeoff List -->
    <div id="estimate-list-wrapper"></div>
  </section>

  <!-- Filter & Search Controls -->
  <div class="controls">
    <div class="filter-buttons" id="filter-buttons">
      <button type="button" class="filter-btn active" data-category="All">All</button>
      <button type="button" class="filter-btn" data-category="Framing & Posts">Framing &amp; Posts</button>
      <button type="button" class="filter-btn" data-category="Headers & Beams">Headers &amp; Beams</button>
      <button type="button" class="filter-btn" data-category="Sheathing & Subfloor">Sheathing &amp; Subfloor</button>
      <button type="button" class="filter-btn" data-category="Trim & Paneling">Trim &amp; Paneling</button>
      <button type="button" class="filter-btn" data-category="Cabinet Plywood & Sheet">Cabinet Plywood &amp; Sheet</button>
      <button type="button" class="filter-btn" data-category="Hardwood Lumber">Hardwood Lumber</button>
    </div>

    <input
      type="search"
      id="search-input"
      class="search-box"
      placeholder="Search material, size, or store..."
      aria-label="Search lumber prices"
    />
  </div>

  <div id="result-count" class="result-count"></div>

  <div id="prices-container">
    <p class="status">Loading lumber prices...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://atfzmiysioscncztytvu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_K66EHMpK9sulhGWaHdhPSQ_rm0AvcZG';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const COLUMNS = [
      { key: 'material_name', label: 'Material', type: 'text' },
      { key: 'category', label: 'Category', type: 'text' },
      { key: 'dimensions', label: 'Dimensions', type: 'text' },
      { key: 'price_per_board_foot', label: '$/BF', type: 'number' },
      { key: 'unit_price', label: 'Unit Price', type: 'number' },
      { key: 'source_name', label: 'Source', type: 'text' }
    ];

    let allPrices = [];
    let activeCategory = 'All';
    let searchQuery = '';
    let sortKey = null;
    let sortDirection = 'asc';

    // Shared Takeoff List State
    let estimateItems = [];
    let wastePercent = 0;

    function formatPrice(val) {
      if (val === null || val === undefined || val === '') return '—';
      return `$${Number(val).toFixed(2)}`;
    }

    function isSafeUrl(url) {
      if (!url) return false;
      try {
        const parsed = new URL(String(url).trim());
        return parsed.protocol === 'https:' || parsed.protocol === 'http:';
      } catch {
        return false;
      }
    }

    function renderSourceCell(item) {
      const label = item.source_name || 'View Store';
      if (isSafeUrl(item.source_url)) {
        const safeHref = String(item.source_url).trim();
        return `<a class="source-link" href="${safeHref}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
      }
      return item.source_name ?? '—';
    }

    /* ---------------- Unified Estimator Logic ---------------- */
    function populateEstimatorDropdown() {
      const select = document.getElementById('material-select');
      if (!allPrices.length) {
        select.innerHTML = '<option value="">No materials available</option>';
        return;
      }

      const sortedForDropdown = [...allPrices].sort((a, b) =>
        (a.material_name || '').localeCompare(b.material_name || '')
      );

      select.innerHTML = sortedForDropdown.map((item, idx) => {
        const priceText = item.unit_price != null ? `$${Number(item.unit_price).toFixed(2)}` : 'N/A';
        return `<option value="${item.id ?? idx}">${item.material_name} (${item.dimensions || ''}) — ${priceText}</option>`;
      }).join('');

      const hardwoodItem = allPrices.find(
        i => (i.category || '').toLowerCase().includes('hardwood') && i.price_per_board_foot != null
      );
      if (hardwoodItem) {
        document.getElementById('bf-rate').value = Number(hardwoodItem.price_per_board_foot).toFixed(2);
        updateBoardFootCalc();
      }
    }

    function getBoardFootValues() {
      const label = (document.getElementById('bf-label').value || '').trim() || 'Custom Hardwood';
      const t = Math.max(0, parseFloat(document.getElementById('bf-thickness').value) || 0);
      const w = Math.max(0, parseFloat(document.getElementById('bf-width').value) || 0);
      const l = Math.max(0, parseFloat(document.getElementById('bf-length').value) || 0);
      const qty = Math.max(1, parseInt(document.getElementById('bf-qty').value, 10) || 1);
      const rate = Math.max(0, parseFloat(document.getElementById('bf-rate').value) || 0);

      const bfPerPiece = (t * w * l) / 12;
      const totalBf = bfPerPiece * qty;
      const pricePerPiece = bfPerPiece * rate;
      const totalCost = totalBf * rate;

      return { label, t, w, l, qty, rate, bfPerPiece, totalBf, pricePerPiece, totalCost };
    }

    function updateBoardFootCalc() {
      const { bfPerPiece, totalBf, totalCost } = getBoardFootValues();
      document.getElementById('bf-metrics').innerHTML = `
        <div><strong>Per Piece:</strong> ${bfPerPiece.toFixed(2)} BF</div>
        <div><strong>Total Volume:</strong> ${totalBf.toFixed(2)} BF</div>
        <div><strong>Line Cost:</strong> ${formatPrice(totalCost)}</div>
      `;
    }

    function buildTakeoffPlainText() {
      const dateStr = new Date().toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });

      let subtotal = 0;
      let totalCustomBf = 0;

      const lines = estimateItems.map((entry, idx) => {
        const lineTotal = entry.unitPrice * entry.qty;
        subtotal += lineTotal;
        if (entry.bfPerPiece) {
          totalCustomBf += entry.bfPerPiece * entry.qty;
        }
        const storePart = entry.sourceName ? ` [${entry.sourceName}]` : '';
        return `${idx + 1}. ${entry.name} (${entry.dimensions || '—'}) — Qty: ${entry.qty} × ${formatPrice(entry.unitPrice)} = ${formatPrice(lineTotal)}${storePart}`;
      });

      const totalWithWaste = subtotal * (1 + wastePercent / 100);

      const summaryLines = [
        `BoardfootIndex — Project Material Takeoff (${dateStr})`,
        `--------------------------------------------------`,
        ...lines,
        `--------------------------------------------------`,
        `Subtotal: ${formatPrice(subtotal)}`,
        ...(wastePercent > 0 ? [`Waste Factor (+${wastePercent}%): ${formatPrice(totalWithWaste - subtotal)}`] : []),
        ...(totalCustomBf > 0 ? [`Custom Lumber Volume: ${totalCustomBf.toFixed(2)} BF`] : []),
        `Estimated Total: ${formatPrice(totalWithWaste)}`,
        `Generated at https://boardfootindex.com`
      ];

      return summaryLines.join('\n');
    }

    async function copyTakeoffToClipboard(btnEl) {
      const text = buildTakeoffPlainText();
      try {
        await navigator.clipboard.writeText(text);
        const originalText = btnEl.textContent;
        btnEl.textContent = 'Copied! ✓';
        setTimeout(() => {
          btnEl.textContent = originalText;
        }, 2000);
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);

        const originalText = btnEl.textContent;
        btnEl.textContent = 'Copied! ✓';
        setTimeout(() => {
          btnEl.textContent = originalText;
        }, 2000);
      }
    }

    function printTakeoff() {
      const metaEl = document.getElementById('print-meta');
      const dateStr = new Date().toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
      metaEl.textContent = `Project Material Takeoff · Printed ${dateStr} · boardfootindex.com`;
      window.print();
    }

    function renderEstimateList() {
      const wrapper = document.getElementById('estimate-list-wrapper');
      if (estimateItems.length === 0) {
        wrapper.innerHTML = '<p style="font-size: 0.9rem; color: #666; margin: 14px 0 0;">Add standard materials from the index or custom rough-sawn lumber by board foot to build a combined project takeoff.</p>';
        return;
      }

      let subtotal = 0;
      let totalCustomBf = 0;

      const itemsHtml = estimateItems.map((entry, idx) => {
        const lineTotal = entry.unitPrice * entry.qty;
        subtotal += lineTotal;
        if (entry.bfPerPiece) {
          totalCustomBf += entry.bfPerPiece * entry.qty;
        }

        const customBadge = entry.isCustom ? '<span class="badge-custom">BF Calc</span>' : '';
        const bfNote = entry.bfPerPiece
          ? ` · ${(entry.bfPerPiece * entry.qty).toFixed(2)} BF`
          : '';
        const storeNote = entry.sourceName ? ` · ${entry.sourceName}` : '';

        return `
          <div class="estimate-item">
            <div class="estimate-item-info">
              <strong>${entry.name}</strong>${customBadge}
              <div style="color: #666; font-size: 0.88rem; margin-top: 2px;">
                ${entry.dimensions || '—'} · ${formatPrice(entry.unitPrice)} ${entry.unitLabel || ''}${bfNote}${storeNote}
              </div>
            </div>
            <div class="estimate-item-actions">
              <label style="font-size: 0.85rem; color: #555;">Qty:</label>
              <input type="number" min="1" step="1" value="${entry.qty}" data-est-idx="${idx}" class="est-qty-input" />
              <strong style="min-width: 78px; text-align: right;">${formatPrice(lineTotal)}</strong>
              <button type="button" class="remove-btn" data-remove-idx="${idx}" title="Remove item">×</button>
            </div>
          </div>
        `;
      }).join('');

      const totalWithWaste = subtotal * (1 + wastePercent / 100);

      wrapper.innerHTML = `
        <div class="estimate-list">
          <div class="estimate-list-header">
            <div class="estimate-list-title">Project Takeoff List (${estimateItems.length} ${estimateItems.length === 1 ? 'line' : 'lines'})</div>
            <div class="export-actions">
              <button type="button" class="secondary-btn" id="copy-takeoff-btn">Copy Takeoff</button>
              <button type="button" class="secondary-btn" id="print-takeoff-btn">Print / Save PDF</button>
            </div>
          </div>
          ${itemsHtml}
          <div class="estimate-summary">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
              <label for="waste-select" style="font-size: 0.9rem; color: #555;">Waste Factor:</label>
              <select id="waste-select" style="padding: 5px 8px; border: 1px solid #ccc; border-radius: 5px;">
                <option value="0" ${wastePercent === 0 ? 'selected' : ''}>0% (Exact)</option>
                <option value="10" ${wastePercent === 10 ? 'selected' : ''}>+10% (Standard)</option>
                <option value="15" ${wastePercent === 15 ? 'selected' : ''}>+15% (Complex cuts)</option>
              </select>
              <button type="button" class="secondary-btn" id="clear-estimate-btn">Clear All</button>
            </div>
            <div class="total-box">
              Project Total: ${formatPrice(totalWithWaste)}
              ${wastePercent > 0 ? `<small style="font-weight: 400; color: #666; font-size: 0.85rem;">(Subtotal ${formatPrice(subtotal)})</small>` : ''}
              ${totalCustomBf > 0 ? `<div style="font-size: 0.82rem; font-weight: 500; color: #555; text-align: right;">Includes ${totalCustomBf.toFixed(2)} BF custom lumber</div>` : ''}
            </div>
          </div>
        </div>
      `;

      wrapper.querySelectorAll('.est-qty-input').forEach(input => {
        input.addEventListener('change', e => {
          const i = Number(e.target.dataset.estIdx);
          const val = Math.max(1, parseInt(e.target.value, 10) || 1);
          estimateItems[i].qty = val;
          renderEstimateList();
        });
      });

      wrapper.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          const i = Number(e.target.dataset.removeIdx);
          estimateItems.splice(i, 1);
          renderEstimateList();
        });
      });

      document.getElementById('copy-takeoff-btn').addEventListener('click', e => {
        copyTakeoffToClipboard(e.currentTarget);
      });

      document.getElementById('print-takeoff-btn').addEventListener('click', () => {
        printTakeoff();
      });

      document.getElementById('waste-select').addEventListener('change', e => {
        wastePercent = Number(e.target.value);
        renderEstimateList();
      });

      document.getElementById('clear-estimate-btn').addEventListener('click', () => {
        estimateItems = [];
        renderEstimateList();
      });
    }

    function setupEstimator() {
      const tabCatalog = document.getElementById('tab-catalog');
      const tabBf = document.getElementById('tab-bf');
      const panelCatalog = document.getElementById('panel-catalog');
      const panelBf = document.getElementById('panel-bf');

      tabCatalog.addEventListener('click', () => {
        tabCatalog.classList.add('active');
        tabBf.classList.remove('active');
        panelCatalog.style.display = 'block';
        panelBf.style.display = 'none';
      });

      tabBf.addEventListener('click', () => {
        tabBf.classList.add('active');
        tabCatalog.classList.remove('active');
        panelBf.style.display = 'block';
        panelCatalog.style.display = 'none';
        updateBoardFootCalc();
      });

      document.getElementById('add-to-estimate-btn').addEventListener('click', () => {
        const select = document.getElementById('material-select');
        const qtyInput = document.getElementById('material-qty');
        const selectedVal = select.value;
        const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);

        const matchedItem = allPrices.find((item, idx) => String(item.id ?? idx) === String(selectedVal));
        if (!matchedItem) return;

        const key = `catalog-${matchedItem.id ?? matchedItem.material_name}-${matchedItem.dimensions}`;
        const existing = estimateItems.find(e => e.key === key);
        if (existing) {
          existing.qty += qty;
        } else {
          estimateItems.push({
            key,
            name: matchedItem.material_name,
            dimensions: matchedItem.dimensions,
            unitPrice: Number(matchedItem.unit_price || 0),
            unitLabel: matchedItem.unit_label || 'each',
            sourceName: matchedItem.source_name || '',
            qty,
            isCustom: false,
            bfPerPiece: null
          });
        }

        qtyInput.value = 1;
        renderEstimateList();
      });

      document.getElementById('add-bf-to-estimate-btn').addEventListener('click', () => {
        const { label, t, w, l, qty, rate, bfPerPiece, pricePerPiece } = getBoardFootValues();
        if (bfPerPiece <= 0) return;

        const dims = `${t}" × ${w}" × ${l}' @ $${rate.toFixed(2)}/BF`;
        const key = `custom-${label}-${dims}`;
        const existing = estimateItems.find(e => e.key === key);

        if (existing) {
          existing.qty += qty;
        } else {
          estimateItems.push({
            key,
            name: label,
            dimensions: dims,
            unitPrice: pricePerPiece,
            unitLabel: `(${bfPerPiece.toFixed(2)} BF/pc)`,
            sourceName: 'Custom BF',
            qty,
            isCustom: true,
            bfPerPiece
          });
        }

        renderEstimateList();
      });

      ['bf-label', 'bf-thickness', 'bf-width', 'bf-length', 'bf-qty', 'bf-rate'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateBoardFootCalc);
      });

      renderEstimateList();
      updateBoardFootCalc();
    }

    /* ---------------- Table Sorting & Filtering ---------------- */
    function compareItems(a, b) {
      if (!sortKey) return 0;

      const col = COLUMNS.find(c => c.key === sortKey);
      const valA = a[sortKey];
      const valB = b[sortKey];

      if (col && col.type === 'number') {
        const numA = valA === null || valA === undefined || valA === '' ? null : Number(valA);
        const numB = valB === null || valB === undefined || valB === '' ? null : Number(valB);

        if (numA === null && numB === null) return 0;
        if (numA === null) return 1;
        if (numB === null) return -1;

        return sortDirection === 'asc' ? numA - numB : numB - numA;
      }

      const strA = (valA ?? '').toString().trim().toLowerCase();
      const strB = (valB ?? '').toString().trim().toLowerCase();

      if (!strA && !strB) return 0;
      if (!strA) return 1;
      if (!strB) return -1;

      const cmp = strA.localeCompare(strB, undefined, { numeric: true, sensitivity: 'base' });
      return sortDirection === 'asc' ? cmp : -cmp;
    }

    function handleSortClick(key) {
      if (sortKey === key) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = key;
        sortDirection = 'asc';
      }
      renderTable();
    }

    function renderTable() {
      const container = document.getElementById('prices-container');
      const countEl = document.getElementById('result-count');

      const filtered = allPrices.filter(item => {
        const matchesCategory =
          activeCategory === 'All' || (item.category || '').trim() === activeCategory;

        const q = searchQuery.trim().toLowerCase();
        const matchesSearch =
          !q ||
          [
            item.material_name,
            item.category,
            item.dimensions,
            item.source_name,
            item.source_url,
            item.notes,
            item.unit_label
          ]
            .filter(Boolean)
            .some(field => String(field).toLowerCase().includes(q));

        return matchesCategory && matchesSearch;
      });

      const sorted = sortKey ? [...filtered].sort(compareItems) : filtered;

      countEl.textContent = `Showing ${sorted.length} of ${allPrices.length} items`;

      if (sorted.length === 0) {
        container.innerHTML = '<p class="status">No matching lumber items found.</p>';
        return;
      }

      const headersHtml = COLUMNS.map(col => {
        const isSorted = sortKey === col.key;
        const indicator = isSorted
          ? (sortDirection === 'asc' ? '▲' : '▼')
          : '⇅';
        return `
          <th class="sortable ${isSorted ? 'sorted' : ''}" data-sort-key="${col.key}">
            ${col.label}<span class="sort-indicator">${indicator}</span>
          </th>
        `;
      }).join('');

      const rowsHtml = sorted.map(item => `
        <tr>
          <td><strong>${item.material_name ?? ''}</strong></td>
          <td>${item.category ?? '—'}</td>
          <td>${item.dimensions ?? '—'}</td>
          <td>${formatPrice(item.price_per_board_foot)}</td>
          <td>${formatPrice(item.unit_price)} ${item.unit_label ? `<small>(${item.unit_label})</small>` : ''}</td>
          <td>${renderSourceCell(item)}</td>
        </tr>
      `).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              ${headersHtml}
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      `;

      container.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', () => handleSortClick(th.dataset.sortKey));
      });
    }

    function setupControls() {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategory = btn.dataset.category;
          renderTable();
        });
      });

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', e => {
        searchQuery = e.target.value;
        renderTable();
      });
    }

    async function loadPrices() {
      const container = document.getElementById('prices-container');
      const { data, error } = await supabaseClient
        .from('lumber_prices')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error:', error);
        container.innerHTML = `<p style="color: #b00020;">Could not load prices: ${error.message}</p>`;
        return;
      }

      allPrices = data || [];
      populateEstimatorDropdown();
      renderTable();
    }

    setupEstimator();
    setupControls();
    loadPrices();
  </script>
</body>
</html>
