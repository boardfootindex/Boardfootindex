<!DOCTYPE html>
<html>
<head>
  <title>BoardfootIndex | Lumber & Workshop Cost Index</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; text-align: center; padding: 60px 20px; color: #333; }
    h1 { font-size: 2.5rem; color: #111; margin-bottom: 10px; }
    p { font-size: 1.2rem; color: #666; margin-bottom: 40px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #ddd; }
    th { background-color: #f5f5f5; font-weight: 600; color: #111; }
    tr:hover { background-color: #fafafa; }
    .status { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <h1>BoardfootIndex</h1>
  <p>Automated outbuilding, workshop, and lumber price tracking engine coming online.</p>

  <div id="prices-container">
    <p class="status">Loading lumber prices...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://atfzmiysioscncztytvu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_K66EHMpK9sulhGWaHdhPSQ_rm0AvcZG';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function formatPrice(val) {
      if (val === null || val === undefined || val === '') return '—';
      return `$${Number(val).toFixed(2)}`;
    }

    async function loadPrices() {
      const container = document.getElementById('prices-container');
      const { data, error } = await supabaseClient
        .from('lumber_prices')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error:', error);
        container.innerHTML = `<p style="color: #b00020;">Could not load prices: ${error.message}</p>`;
        return;
      }

      console.log('Lumber Data:', data);

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="status">No lumber prices found yet.</p>';
        return;
      }

      const rowsHtml = data.map(item => `
        <tr>
          <td><strong>${item.material_name ?? ''}</strong></td>
          <td>${item.category ?? '—'}</td>
          <td>${item.dimensions ?? '—'}</td>
          <td>${formatPrice(item.price_per_board_foot)}</td>
          <td>${formatPrice(item.unit_price)} ${item.unit_label ? `<small>(${item.unit_label})</small>` : ''}</td>
          <td>${item.source_name ?? '—'}</td>
        </tr>
      `).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Material</th>
              <th>Category</th>
              <th>Dimensions</th>
              <th>$/BF</th>
              <th>Unit Price</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      `;
    }

    loadPrices();
  </script>
</body>
</html>
