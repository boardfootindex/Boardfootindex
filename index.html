<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardfootIndex | Lumber & Workshop Cost Index</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      max-width: 980px;
      margin: 0 auto;
      text-align: center;
      padding: 48px 20px 80px;
      color: #333;
    }
    h1 {
      font-size: 2.5rem;
      color: #111;
      margin-bottom: 10px;
    }
    p.subtitle {
      font-size: 1.15rem;
      color: #666;
      margin-bottom: 28px;
    }

    /* Estimator Card */
    .estimator-card {
      background-color: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 32px;
      text-align: left;
    }
    .estimator-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .estimator-header h2 {
      font-size: 1.25rem;
      margin: 0;
      color: #111;
    }
    .estimator-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 6px 12px;
      border: 1px solid #ccc;
      background: #fff;
      color: #222;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
      font-weight: 600;
    }
    .estimator-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
    }
    .field-group select,
    .field-group input {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fff;
      color: #222;
    }
    .field-group.grow {
      flex: 1;
      min-width: 220px;
    }
    .field-group.med {
      width: 165px;
    }
    .field-group.small {
      width: 98px;
    }
    .primary-btn {
      padding: 9px 16px;
      background: #111;
      color: #fff;
      border: 1px solid #111;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .primary-btn:hover {
      background: #2b2b2b;
    }
    .secondary-btn {
      padding: 6px 10px;
      background: #fff;
      color: #444;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .secondary-btn:hover {
      background: #f0f0f0;
    }
    .bf-result-box {
      margin-top: 14px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #e2e5e9;
      border-radius: 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      font-size: 0.96rem;
    }
    .bf-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    .estimate-list {
      margin-top: 18px;
      border-top: 1px solid #e2e5e9;
      padding-top: 14px;
    }
    .estimate-list-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
      margin-bottom: 8px;
    }
    .estimate-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eceef1;
      font-size: 0.95rem;
    }
    .estimate-item-info {
      flex: 1;
      min-width: 210px;
    }

      font-size: 0.72rem;
