<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BoardfootIndex | Regional Lumber Prices & Project Takeoff Estimator</title>
<meta name="description" content="Track live regional lumber and sheet-good prices across the US, calculate board feet, and build instant project material takeoffs." />
<meta property="og:title" content="BoardfootIndex | Regional Lumber Prices & Project Takeoff Estimator" />
<meta property="og:description" content="Live regional lumber & sheet-good prices, board-foot calculator, and instant project takeoff estimator." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://boardfootindex.com" />
<link rel="icon" type="image/png" href="/logo-icon.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
* {
  box-sizing: border-box;
}
body {
  font-family: sans-serif;
  max-width: 980px;
  margin: 0 auto;
  text-align: center;
  padding: 44px 20px 60px;
  color: #333;
}
.brand-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 28px;
}
.brand-logo {
  max-height: clamp(72px, 11vw, 112px);
  width: auto;
  max-width: 100%;
  height: auto;
  display: block;
  margin-bottom: 12px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
p.subtitle {
  font-size: 1.12rem;
  color: #555;
  margin: 0;
  max-width: 680px;
  line-height: 1.45;
}
.freshness-bar {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
  padding: 5px 12px;
  border-radius: 999px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  font-size: 0.82rem;
  color: #475569;
}
.freshness-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16a34a;
  display: inline-block;
}
.print-meta {
  display: none;
}

/* Regional Map & Region Bar */
.regional-card {
  background-color: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 24px;
  text-align: left;
}
.regional-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.regional-title-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.regional-title-group h2 {
  font-size: 1.1rem;
  margin: 0;
  color: #111;
}
.region-pill {
  display: inline-block;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: #fff3e6;
  color: #c2410c;
  border: 1px solid #fdba74;
}
.regional-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.region-select {
  padding: 7px 11px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 0.92rem;
  background: #fff;
  color: #222;
  font-weight: 500;
}
.region-quick-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}
.region-chip {
  padding: 5px 10px;
  border: 1px solid #d1d5db;
  background: #f9fafb;
  color: #222;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}
.region-chip:hover {
  background: #ffedd5;
  border-color: #fb923c;
}
.region-chip.active {
  background: #ea580c;
  color: #fff;
  border-color: #ea580c;
  font-weight: 600;
}
.map-wrapper {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #eee;
  position: relative;
}
.map-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 0.82rem;
  color: #666;
  margin-bottom: 8px;
}
.legend-items {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
}
.legend-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  margin-right: 5px;
  vertical-align: middle;
  border: 1px solid #cbd5e1;
}
#us-map-container {
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
}
#us-map-container svg {
  width: 100%;
  height: auto;
  display: block;
}
.state-path {
  fill: #e5e7eb;
  stroke: #ffffff;
  stroke-width: 0.9;
  cursor: pointer;
  transition: fill 0.15s ease;
}
.state-path.has-data {
  fill: #fed7aa;
}
.state-path.region-hover {
  fill: #fb923c;
}
.state-path.selected {
  fill: #ea580c;
  stroke: #111;
  stroke-width: 1.6;
}
.region-boundary {
  fill: none;
  stroke: #374151;
  stroke-width: 1.4;
  stroke-linejoin: round;
  pointer-events: none;
}
